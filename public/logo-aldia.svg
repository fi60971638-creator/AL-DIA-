<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2c58" />
      <stop offset="100%" stop-color="#071d3c" />
    </linearGradient>
    <linearGradient id="greenArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d6838" />
      <stop offset="40%" stop-color="#149551" />
      <stop offset="100%" stop-color="#2bc26c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf8524" />
      <stop offset="50%" stop-color="#e2ab39" />
      <stop offset="100%" stop-color="#f8cf5d" />
    </linearGradient>
    <linearGradient id="navyShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2b54" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#04142b" stop-opacity="0.95" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Ring with clean border -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="#0e3768" stroke-width="24" filter="url(#subtleDrop)" />

  <!-- Inner Graphic Group (shifted up for text balance) -->
  <g transform="translate(0, -25)">
    <!-- Gold Circular Arc / Crest Behind -->
    <path d="M 270 125 A 95 95 0 1 1 180 290" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Gold Chart Bars Inside -->
    <rect x="238" y="165" width="16" height="55" rx="3" fill="url(#goldGrad)" />
    <rect x="260" y="148" width="16" height="72" rx="3" fill="url(#goldGrad)" />
    <rect x="282" y="132" width="16" height="88" rx="3" fill="url(#goldGrad)" />

    <!-- Green Circle Arc Top Left -->
    <path d="M 245 110 A 100 100 0 0 0 175 220" fill="none" stroke="url(#greenArrowGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Dollar Sign Symbol '$' on left -->
    <g transform="translate(162, 140)">
      <path d="M 45 42 C 45 28 32 24 22 24 C 10 24 2 28 2 38 C 2 56 46 48 46 72 C 46 84 35 92 22 92 C 10 92 0 85 0 74" fill="none" stroke="url(#greenArrowGrad)" stroke-width="13" stroke-linecap="round" />
      <!-- Dollar vertical line -->
      <line x1="22" y1="12" x2="22" y2="104" stroke="url(#greenArrowGrad)" stroke-width="9" stroke-linecap="round" />
    </g>

    <!-- Stylized Zig-Zag Growth Arrow in Navy and Green -->
    <!-- Dark Blue Base Line -->
    <path d="M 175 252 L 235 252 L 270 198 L 315 250" fill="none" stroke="#0b2b54" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Green Arrow Overlay Body -->
    <path d="M 188 245 L 236 245 L 268 190 L 318 240 L 340 135" fill="none" stroke="url(#greenArrowGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Arrow Head -->
    <polygon points="340,110 365,168 310,146" fill="url(#greenArrowGrad)" />
  </g>

  <!-- Typography -->
  <!-- "AL DÍA" in bold primary navy -->
  <text x="250" y="385" text-anchor="middle" font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" font-size="64" font-weight="900" fill="#0c3260" letter-spacing="3">
    AL DÍA
  </text>

  <!-- "FINANZAS" in clean secondary font -->
  <text x="250" y="432" text-anchor="middle" font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" font-size="34" font-weight="800" fill="#444b58" letter-spacing="9">
    FINANZAS
  </text>
</svg>
